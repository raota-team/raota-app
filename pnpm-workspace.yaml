packages:
  - '.'
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  # 출시 빌드에서 소스맵을 Sentry로 올리는 sentry-cli 바이너리를 받는다
  '@sentry/cli': true
  # eas-cli가 끌고 오는 선택 의존성. 설치 스크립트 없이도 eas update가 돈다
  dtrace-provider: false
  protobufjs: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.22'
  - '@expo/ui@57.0.16'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo-router@57.0.19
  - expo@57.0.20
  - expo-image-picker@57.0.16
  - expo-location@57.0.16
  - expo-constants@57.0.19
  - expo-notifications@57.0.20
